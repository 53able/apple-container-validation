<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1252 850" width="1252" height="850" role="img" aria-labelledby="t d" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<title id="t">apple-container-validation スキルのアーキテクチャ</title>
<desc id="d">検証は5段階（仮説固定とpreflight、ケース設計、検証とスモーク、並列実行、判定と報告）で進む。各段階で読む同梱ファイルが決まっている。設計段階では manifest-spec と case-design と manifest-template から manifest.json を作り、validate-manifest.py で検証して results-smoke に試走する。run-matrix.py は validate-manifest.py を読み込み、Apple Container の container run --rm --init でジョブを並列起動して results/run-id/jobs に証跡を書く。それを summary.json と世代別 report に集約し、この2つが SHA-256 で結ばれた権威ある結果になる。利用者向けレポートは report-template から書き、世代別 report のパスと SHA-256 を引用する。Apple Container が使えなければ BLOCKED レポートで止まる。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#292524"/></marker>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534E"/></marker>
</defs>
<rect width="1252" height="850" fill="#FFFFFF"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1C1917">apple-container-validation のアーキテクチャ：手順・同梱ファイル・実行時成果物</text>
<rect x="12" y="56" width="1228" height="118" rx="10" fill="#EEF2FF"/>
<text x="24" y="78" font-size="13" font-weight="700" fill="#292524">エージェントの手順<tspan font-weight="400" fill="#57534E" font-size="12">　列ごとに1段階。左から順に進む</tspan></text>
<rect x="12" y="186" width="1228" height="258" rx="10" fill="#F5F5F4"/>
<text x="24" y="208" font-size="13" font-weight="700" fill="#292524">スキル同梱ファイル<tspan font-weight="400" fill="#57534E" font-size="12">　その段階で読む・実行するもの（列のそろいが「この段階で使う」を表す）</tspan></text>
<rect x="12" y="456" width="1228" height="306" rx="10" fill="#ECFDF5"/>
<text x="24" y="478" font-size="13" font-weight="700" fill="#292524">実行時に生まれるもの<tspan font-weight="400" fill="#57534E" font-size="12">　検証ワークスペースに作られる</tspan></text>
<g id="p1"><rect x="24" y="88" width="196" height="74" rx="10" fill="#3730A3"/>
<text x="36" y="110" font-size="14" font-weight="700" fill="#FFFFFF">1–2 仮説固定・事前確認</text>
<text x="36" y="130" font-size="11.5" fill="#E0E7FF">棄却条件・オラクル・relationを</text>
<text x="36" y="147" font-size="11.5" fill="#E0E7FF">結果を見る前に決める</text>
</g>
<line x1="224" y1="125" x2="272" y2="125" stroke="#292524" stroke-width="2" marker-end="url(#ar)"/>
<g id="p2"><rect x="276" y="88" width="196" height="74" rx="10" fill="#3730A3"/>
<text x="288" y="110" font-size="14" font-weight="700" fill="#FFFFFF">3 ケース行列を設計</text>
<text x="288" y="130" font-size="11.5" fill="#E0E7FF">support / falsify / neutral の</text>
<text x="288" y="147" font-size="11.5" fill="#E0E7FF">ケースを manifest に書く</text>
</g>
<line x1="476" y1="125" x2="524" y2="125" stroke="#292524" stroke-width="2" marker-end="url(#ar)"/>
<g id="p3"><rect x="528" y="88" width="196" height="74" rx="10" fill="#3730A3"/>
<text x="540" y="110" font-size="14" font-weight="700" fill="#FFFFFF">4–5 検証・スモーク</text>
<text x="540" y="130" font-size="11.5" fill="#E0E7FF">validator が通るまで直し、</text>
<text x="540" y="147" font-size="11.5" fill="#E0E7FF">--dry-run と小行列で試す</text>
</g>
