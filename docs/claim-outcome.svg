<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 352" width="1008" height="352" role="img" aria-labelledby="t d" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<title id="t">仮説評価 claimOutcome の決まり方</title>
<desc id="d">ジョブの結果を上の行から順に照合し、最初に当てはまった行で仮説評価が決まる。falsify ケースに oracle-pass が1件でもあれば FALSIFIED。support が全件 oracle-pass で falsify が全件 oracle-fail なら SUPPORTED WITHIN TESTED SCOPE。falsify が全件 oracle-fail で support は一部だけ oracle-pass なら PARTIALLY SUPPORTED WITHIN TESTED SCOPE。それ以外は timeout や欠損を含めて UNVERIFIED。neutral ケースは判定に入らない。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#292524"/></marker>
</defs>
<rect width="1008" height="352" fill="#FFFFFF"/>
<text x="16" y="34" font-size="20" font-weight="700" fill="#1C1917">仮説評価（claimOutcome）の決まり方</text>
<text x="16" y="60" font-size="14" fill="#57534E">上の行から順に照合し、最初に当てはまった行で決まる。neutral ケースは判定に入らない</text>

<rect x="16" y="88" width="580" height="52" rx="8" fill="#FFFFFF" stroke="#A8A29E" stroke-width="1.2"/>
<text x="34" y="120" font-size="15" fill="#1C1917"><tspan font-weight="700">1</tspan>　falsify ケースに oracle-pass が1件でもある</text>
<line x1="596" y1="114" x2="632" y2="114" stroke="#292524" stroke-width="2" marker-end="url(#ar)"/>
<g id="o1"><rect x="634" y="88" width="358" height="52" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.6"/>
<text x="813" y="120" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">FALSIFIED</text></g>

<rect x="16" y="152" width="580" height="52" rx="8" fill="#FFFFFF" stroke="#A8A29E" stroke-width="1.2"/>
<text x="34" y="184" font-size="15" fill="#1C1917"><tspan font-weight="700">2</tspan>　support が全件 pass、falsify が全件 fail</text>
<line x1="596" y1="178" x2="632" y2="178" stroke="#292524" stroke-width="2" marker-end="url(#ar)"/>
<g id="o2"><rect x="634" y="152" width="358" height="52" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/>
<text x="813" y="184" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">SUPPORTED WITHIN TESTED SCOPE</text></g>

<rect x="16" y="216" width="580" height="52" rx="8" fill="#FFFFFF" stroke="#A8A29E" stroke-width="1.2"/>
<text x="34" y="248" font-size="15" fill="#1C1917"><tspan font-weight="700">3</tspan>　falsify が全件 fail、support は一部だけ pass</text>
<line x1="596" y1="242" x2="632" y2="242" stroke="#292524" stroke-width="2" marker-end="url(#ar)"/>
<g id="o3"><rect x="634" y="216" width="358" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.6"/>
<text x="813" y="241" font-size="14" font-weight="700" fill="#78350F" text-anchor="middle">PARTIALLY SUPPORTED</text>
<text x="813" y="259" font-size="14" font-weight="700" fill="#78350F" text-anchor="middle">WITHIN TESTED SCOPE</text></g>

<rect x="16" y="280" width="580" height="52" rx="8" fill="#FFFFFF" stroke="#A8A29E" stroke-width="1.2"/>
<text x="34" y="312" font-size="15" fill="#1C1917"><tspan font-weight="700">4</tspan>　それ以外（timeout・欠損を含む）</text>
<line x1="596" y1="306" x2="632" y2="306" stroke="#292524" stroke-width="2" marker-end="url(#ar)"/>
<g id="o4"><rect x="634" y="280" width="358" height="52" rx="8" fill="#F5F5F4" stroke="#57534E" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="813" y="312" font-size="15" font-weight="700" fill="#292524" text-anchor="middle">UNVERIFIED</text></g>
</svg>
