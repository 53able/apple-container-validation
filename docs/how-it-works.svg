<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 236" width="1008" height="236" role="img" aria-labelledby="t d" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<title id="t">apple-container-validation の仕組み</title>
<desc id="d">技術的主張を検証する5段階の流れ。仮説と棄却条件を結果より先に固定し、各ケースに support・falsify・neutral を割り当てたケース行列を作り、Apple Container でジョブごとに隔離して並列実行し、結果から仮説を FALSIFIED・SUPPORTED・UNVERIFIED などに評価し、ログと来歴付きの Markdown レポートにまとめる。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#292524"/></marker>
</defs>
<rect width="1008" height="236" fill="#FFFFFF"/>
<text x="16" y="34" font-size="20" font-weight="700" fill="#1C1917">apple-container-validation の仕組み</text>
<text x="16" y="60" font-size="14" fill="#57534E">判定基準を結果より先に決め、隔離した環境で実測して、仮説を評価する</text>

<g id="p1"><rect x="16" y="88" width="168" height="112" rx="10" fill="#3730A3"/>
<text x="32" y="118" font-size="15" font-weight="700" fill="#FFFFFF">1 判定基準を固定</text>
<text x="32" y="148" font-size="13" fill="#E0E7FF">仮説と棄却条件を</text>
<text x="32" y="168" font-size="13" fill="#E0E7FF">結果より先に決める</text></g>
<line x1="184" y1="144" x2="216" y2="144" stroke="#292524" stroke-width="2" marker-end="url(#ar)"/>

<g id="p2"><rect x="218" y="88" width="168" height="112" rx="10" fill="#3730A3"/>
<text x="234" y="118" font-size="15" font-weight="700" fill="#FFFFFF">2 ケース行列</text>
<text x="234" y="148" font-size="13" fill="#E0E7FF">各ケースに support・</text>
<text x="234" y="168" font-size="13" fill="#E0E7FF">falsify・neutral を</text>
<text x="234" y="188" font-size="13" fill="#E0E7FF">割り当てる</text></g>
<line x1="386" y1="144" x2="418" y2="144" stroke="#292524" stroke-width="2" marker-end="url(#ar)"/>

<g id="p3"><rect x="420" y="88" width="168" height="112" rx="10" fill="#3730A3"/>
<text x="436" y="118" font-size="15" font-weight="700" fill="#FFFFFF">3 隔離して並列実行</text>
<text x="436" y="148" font-size="13" fill="#E0E7FF">Apple Container で</text>
<text x="436" y="168" font-size="13" fill="#E0E7FF">ジョブごとに隔離する</text></g>
<line x1="588" y1="144" x2="620" y2="144" stroke="#292524" stroke-width="2" marker-end="url(#ar)"/>

<g id="p4"><rect x="622" y="88" width="168" height="112" rx="10" fill="#3730A3"/>
<text x="638" y="118" font-size="15" font-weight="700" fill="#FFFFFF">4 仮説を評価</text>
<text x="638" y="148" font-size="13" fill="#E0E7FF">FALSIFIED・</text>
<text x="638" y="168" font-size="13" fill="#E0E7FF">SUPPORTED・</text>
<text x="638" y="188" font-size="13" fill="#E0E7FF">UNVERIFIED など</text></g>
<line x1="790" y1="144" x2="822" y2="144" stroke="#292524" stroke-width="2" marker-end="url(#ar)"/>

<g id="p5"><rect x="824" y="88" width="168" height="112" rx="10" fill="#FFFFFF" stroke="#3730A3" stroke-width="2"/>
<text x="840" y="118" font-size="15" font-weight="700" fill="#1C1917">5 レポート</text>
<text x="840" y="148" font-size="13" fill="#44403C">ログと来歴付きの</text>
<text x="840" y="168" font-size="13" fill="#44403C">Markdown</text></g>
</svg>
